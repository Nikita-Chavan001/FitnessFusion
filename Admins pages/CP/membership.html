<style>
    body {
        background-color: #000; /* Black background */
        color: #fff; /* White text */

    /* Navbar background */
    .navbar {
        background-color: #000; /* Black background for the navbar */
    }

        color: #ff4500 !important; /* Orange-red color for the active page */

        display: flex;

    }

    .navbar-nav .nav-item {
        margin-right: 10px; /* Adjust spacing between items */

        padding-left: 0;
        padding-right: 0;
    }

    /* Workout Page Content */
    .workout-container {
        margin-top: 50px;

        background-color: #333;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
    }

    .form-container label {
        color: #fff;
    }

    .form-container input[type="text"],
    .form-container textarea {
        background-color: #555;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 10px;
        width: 100%;
        margin-bottom: 10px;
    }

    .form-container input[type="file"] {
        background-color: #555;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 10px;
        width: 100%;
        margin-bottom: 10px;
    }

    .form-container .btn {
        margin-top: 10px;
    }
    .container {
        position: relative;
      }

      #workout-title {
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.35);
        font-size: 7em;
        font-weight: 900;

        text-transform: uppercase;
        text-align: center;
        margin-bottom: 0%;
        position: relative; /* Added */
      }

      #desc {
        position: absolute; /* Added */
        bottom: -30px; /* Added */
        left: 50%; /* Added */
        transform: translateX(-50%); /* Added */

        text-align: center;
        color: white;
        font-weight: 800;
        margin-bottom: 50px;
        font-family: "Montserrat", sans-serif;
        text-transform: uppercase;

<!-- Membership Page Form -->
<div class="container workout-container">
    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="form-container">
                <form>
                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" class="form-control" id="title" placeholder="Enter title">
                    </div>


                    <div class="form-group">
                        <label for="description">Description:</label>
                        <textarea class="form-control" id="description" rows="3" placeholder="Enter description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="features">Key Features:</label>
                        <textarea class="form-control" id="features" rows="3" placeholder="Enter key features"></textarea>
                    </div>
                    <button type="button" class="btn btn-outline-primary">Add</button>
                    <button type="button" class="btn btn-outline-danger">Delete</button>
                    <button type="button" class="btn btn-outline-warning">Update</button>
                </form>
            </div>
        </div>
    </div>
</div>
