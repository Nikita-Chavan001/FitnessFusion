<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>common-layout</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-gXw1Wt46k/7jgkFsLr2lVfwG2tbyjfuO3p+9FmrBQo1hIy2PqkDm/I8dxOqs9RCrFzQj2dMZ36qgDH19J5zE9Q=="
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        background-color: #000; /* Black background */
        color: #fff; /* White text */
      }

      /* Image hover effect */
      .img-hover:hover {
        transform: scale(1.05); /* Increase scale on hover */
      }
      /* Section hover effect */
      .section-hover:hover {
        background-color: #ff4500; /* Lighter orange-red background on hover */
      }
      /* Navbar background */
      .navbar {
        background-color: #000; /* Black background for the navbar */
      }
      /* Active page color */
      .navbar-nav .nav-item.active .nav-link {
        color: #ff4500 !important; /* Orange-red color for the active page */
      }
      /* Hover color for the navigation items */

      .navbar-nav .nav-link:hover {
        color: #ff4500 !important; /* Add !important for higher specificity */
      }

      /* Align items in navbar */
      .navbar-nav {
        display: flex;
        align-items: center;
      }
      .navbar-nav .nav-item {
        margin-right: 10px; /* Adjust spacing between items */
      }
      .navbar .container {
        padding-left: 0;
        padding-right: 0;
      }
      .icons a:hover i {
        color: #ff5e00; /* Hover color (blue) */
      }

      * {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: black;
      }
      

      body {
        /* margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column; */
      }

      /* .icons{
    height: 25px;
    width: 25px;
  } */
    </style>
  </head>
  <body class="font-sans">
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container mx-auto">
        <img
          src="logo.png"
          alt="Fitness Fusion Logo"
          class="h-12 w-auto mr-2"
        />
        <a class="navbar-brand font-bold" href="#" style="font-size: 24px"
          >Fitness Fusion</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item active">
              <a class="nav-link" href="#about-gym" style="font-size: 18px"
                >Home</a
              >
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="workoutDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="font-size: 18px">
                  Workouts
              </a>
              <div class="dropdown-menu" aria-labelledby="workoutDropdown">
                  <a class="dropdown-item" href="#" onclick="openForm('cardsForm')">Cards</a>
                  <a class="dropdown-item" href="#" onclick="openForm('videoForm')">Video</a>
              </div>
          </li>
            <li class="nav-item">
              <a class="nav-link" href="#sponsors" style="font-size: 18px"
                >Membership</a
              >
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                style="font-size: 18px"
                id="navbarDropdown"
                role="button"
                data-toggle="dropdown"
                aria-haspopup="true"
                aria-expanded="false"
              >
                Facilities
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item" href="#">Programs</a>
                <a class="dropdown-item" href="#">Amenities</a>
              </div>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#sponsors" style="font-size: 18px"
                >Gallery</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#sponsors" style="font-size: 18px"
                >Contact Us</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#sponsors" style="font-size: 18px"
                >About Us</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <hr style="border-color: white" />
    <!--nav ends-->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
