<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Fusion - Gallery</title>
<!-- Bootstrap CSS -->
<link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
<!-- Tailwind CSS -->
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<!-- Font Awesome CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-gXw1Wt46k/7jgkFsLr2lVfwG2tbyjfuO3p+9FmrBQo1hIy2PqkDm/I8dxOqs9RCrFzQj2dMZ36qgDH19J5zE9Q==" crossorigin="anonymous"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<style>
    body {
        background-color: #000; /* Black background */
        color: #fff; /* White text */
    }

    /* Navbar background */
    .navbar {
        background-color: #000; /* Black background for the navbar */
    }

    /* Active page color */
    .navbar-nav .nav-item.active .nav-link {
        color: #ff4500 !important; /* Orange-red color for the active page */
    }

    /* Hover color for the navigation items */
    .navbar-nav .nav-link:hover {
        color: #ff4500 !important; /* Add !important for higher specificity */
    }

    /* Align items in navbar */
    .navbar-nav {
        display: flex;
        align-items: center;
    }

    .navbar-nav .nav-item {
        margin-right: 10px; /* Adjust spacing between items */
    }

    .navbar .container {
        padding-left: 0;
        padding-right: 0;
    }

    /* Override common layout styles */
    body {
        background-color: black;
    }

    /* Gallery Section */
    #gallery {
        margin-top: 50px;
    }

    #gallery h2 {
        color: #fff;
        text-align: center;
        margin-bottom: 20px;
    }

    #gallery .form-container {
        background-color: #333;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
    }

    #gallery .form-container label {
        color: #fff;
    }

    #gallery .form-container input[type="file"],
    #gallery .form-container textarea {
        background-color: #555;
        color: #fff;
        border: none;
        border-radius: 5px;
        padding: 10px;
        width: 100%;
        margin-bottom: 10px;
    }

    #gallery .form-container .btn {
        margin-top: 10px;
    }

    #gallery .img-hover:hover {
        transform: scale(1.05); /* Increase scale on hover */
    }

    #gallery .section-hover:hover {
        background-color: #ff4500; /* Lighter orange-red background on hover */
    }

    /* Workout Page Content */
    .container {
        position: relative;
    }

    #workout-title {
        color: transparent;
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.35);
        font-size: 7em;
        font-weight: 900;
        font-family: "Poppins", sans-serif;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 0%;
        position: relative;
    }

    #desc {
        position: absolute;
        bottom: -30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2.4rem;
        text-align: center;
        color: white;
        font-weight: 800;
        margin-bottom: 50px;
        font-family: "Montserrat", sans-serif;
        text-transform: uppercase;
    }
</style>
</head>
<body class="font-sans">
<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container mx-auto">
        <img src="logo.png" alt="Fitness Fusion Logo" class="h-12 w-auto mr-2"/>
        <a class="navbar-brand font-bold" href="#" style="font-size: 24px">Fitness Fusion</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item active">
                    <a class="nav-link" href="#about-gym" style="font-size: 18px">Home</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="wokout.html" id="workoutDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="font-size: 18px">
                        Workouts
                    </a>
                    <div class="dropdown-menu" aria-labelledby="workoutDropdown">
                        <a class="dropdown-item" href="#" onclick="openForm('cardsForm')">Cards</a>
                        <a class="dropdown-item" href="#" onclick="openForm('videoForm')">Video</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="membership.html" style="font-size: 18px">Membership</a>
                </li>
                
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="facilitie.html" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="font-size: 18px">
                        Facilities
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="#">Programs</a>
                        <a class="dropdown-item" href="#">Amenities</a>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gallery.html" style="font-size: 18px">Gallery</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#sponsors" style="font-size: 18px">Contact Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#sponsors" style="font-size: 18px">About Us</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<hr style="border-color: white"/>
<!-- Navigation ends -->
<div class="container">
  <p id="workout-title">ADMIN WINDOW</p>
  <p id="desc">GALLERY section</p>
</div>
<!-- Gallery Section -->
<section id="gallery" class="py-20 bg-gradient-to-r from-black-600 to-red-400 section-hover">
    <div class="container mx-auto text-center">
    
        <div class="row justify-content-center">
            <!-- Image Upload Form -->
            <div class="col-md-6">
                <div id="imageUploadForm" class="form-container">
                    <input type="file" class="form-control" id="imageFile" name="imageFile">
                    <button class="btn btn-outline-success" type="submit">Add</button>
                </div>
            </div>
        </div>
        <!-- Gallery Images -->
        <div class="row mt-5">
            <!-- Gallery images will be displayed here -->
        </div>
    </div>
</section>
<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.6/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    // JavaScript code for handling image upload form submission
    $(document).ready(function(){
      $('#imageUploadForm').submit(function(event){
        event.preventDefault(); // Prevent the default form submission

        // Send an AJAX request to handle image upload
        $.ajax({
          url: 'upload_image.php', // Replace 'upload_image.php' with the URL to your server-side script for handling image upload
          type: 'POST',
          data: new FormData(this),
          contentType: false,
          cache: false,
          processData:false,
          success: function(response){
            // Handle the response from the server
            // For example, display the uploaded image in the gallery
            $('#gallery .row').append('<div class="col-md-4 mb-4"><img src="' + response + '" class="img-fluid rounded img-hover"></div>');
          }
        });
      });
    });
</script>
</body>
</html>
